spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/customerdb}
    username: ${DB_USERNAME:customer}
    password: ${DB_PASSWORD:customer123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: ${SERVER_PORT:8081}